[project]
name = "financial-rag"
version = "0.1.0"
description = "FinRAG — 自研金融领域 RAG 多智能体系统（自定义栈，非 LlamaIndex/LangChain）"
requires-python = ">=3.11"
dependencies = [
    # DashScope：LLM / embedding / rerank
    "dashscope>=1.20.0",
    # 向量库（并传递提供 opentelemetry-api/sdk 与 otlp-grpc-exporter）
    "chromadb>=0.5.0",
    # 文档解析（PDF）
    "PyMuPDF>=1.25.0",
    # 金融数据 / RSS / HTTP
    "tushare>=1.4.0",
    "feedparser>=6.0.0",
    "httpx>=0.27.0",
    # 中文分词
    "jieba>=0.42.1",
    # 文件类型识别 / 正则
    "python-magic>=0.4.27",
    "regex>=2023.12.25",
    # 配置 / 数据校验
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.0.0",
    # 数据处理
    "pandas>=2.0.0",
    # Web 服务
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "python-multipart>=0.0.30",
    # 可观测性埋点基础：no-op 透传 + 离线 InMemorySpanExporter 断言（chromadb 亦传递提供）
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.5.0",
]
observability = [
    # 主环境把 span 经 OTLP/HTTP 推送到独立 phoenix（.venv-obs）所需；
    # 显式声明，不依赖 chromadb 传递的 grpc 版 exporter
    "opentelemetry-exporter-otlp-proto-http>=1.20.0",
]

[tool.uv]
# 本项目是应用而非发布库：不打包安装，代码经 PYTHONPATH/cwd 访问（与 CI 一致）
package = false

# 可选图谱检索依赖 lightrag：PyPI 仅有 0.1.0b6、需从源码安装，故不纳入本文件与 uv.lock；
# 如需启用请按 financial_rag/retrievers/README.md 手动安装到 .venv。
#
# 重依赖 arize-phoenix（可观测性 UI/collector）刻意不进本文件：它与主环境存在硬性版本冲突，
# 隔离安装到独立 .venv-obs（见 requirements-observability.txt 与 scripts/start_phoenix.*）。
