[pytest]
# 让 `pytest` 与 `python -m pytest` 两种方式都无需预设 PYTHONPATH 即可导入 financial_rag。
# （此前仅靠 CI 的 PYTHONPATH=. 环境变量，本地裸跑 pytest tests 会 ModuleNotFoundError。）
pythonpath = .
testpaths = tests
# -ra: 汇总 skip/xfail 原因；--strict-markers: 使用未注册 marker 直接报错，防拼写漂移。
addopts = -ra --strict-markers

markers =
    unit: 纯逻辑单元测试（无 I/O、无 LLM、无网络，快速确定性）
    integration: 跨模块集成测试（用 fake 隔离，仍不碰真实 LLM/网络）
    regression: 钉死 docs/ARCHITECTURE.md §8 Backlog 中的某个具体已知 bug
    slow: 耗时 >1s 的测试，默认快跑通道可用 -m "not slow" 排除
    eval: L1 检索层离线评估（分通道 IR 指标 + 基线回归锁），快跑通道用 -m "not eval" 排除
