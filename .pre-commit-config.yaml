# Pre-commit hooks — 本地提交前自动运行
# 安装: pip install pre-commit && pre-commit install
repos:
  # ── 基础文件检查 ──
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: 清理行尾空格
      - id: end-of-file-fixer
        name: 修复文件末尾换行
      - id: check-yaml
        name: 检查 YAML 语法
      - id: check-added-large-files
        name: 阻止超大文件提交
        args: ['--maxkb=500']
